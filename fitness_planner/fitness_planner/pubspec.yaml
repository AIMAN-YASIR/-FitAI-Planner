name: fitness_planner
description: AI-powered Fitness & Workout Planner App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase (optional - app works without it via local storage)
  firebase_core: ^3.15.2
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.0

  # State Management
  provider: ^6.1.2

  # Charts
  fl_chart: ^0.68.0

  # HTTP for OpenRouter API
  http: ^1.2.1

  # Local Storage (primary data store - works offline)
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true